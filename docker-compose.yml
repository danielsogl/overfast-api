# Long-lived services on the default json-file driver grow without bound; a
# full disk on the VPS takes down postgres and valkey together.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      target: ${BUILD_TARGET:-main}
    command: /code/.venv/bin/fastapi run app/main.py --port 8080 --proxy-headers
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - ${APP_VOLUME_PATH:-/tmp}/app-logs:/code/logs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://0.0.0.0:8080 || exit 1"]
      interval: 5s
      timeout: 5s

  worker:
    build:
      context: .
      target: ${BUILD_TARGET:-main}
    command: /code/.venv/bin/taskiq worker app.adapters.tasks.worker:broker --workers 1
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      - ${APP_VOLUME_PATH:-/tmp}/worker-logs:/code/logs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'taskiq worker' || exit 1"]
      interval: 10s
      timeout: 5s

  scheduler:
    build:
      context: .
      target: ${BUILD_TARGET:-main}
    command: /code/.venv/bin/taskiq scheduler app.adapters.tasks.worker:scheduler
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
    volumes:
      - ${APP_VOLUME_PATH:-/tmp}/worker-logs:/code/logs
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'taskiq scheduler' || exit 1"]
      interval: 10s
      timeout: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-overfast}
      - POSTGRES_USER=${POSTGRES_USER:-overfast}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    volumes:
      # Must be the PGDATA path itself: postgres:17 declares
      # VOLUME /var/lib/postgresql/data, which shadows a mount on the parent
      # with an anonymous volume — `docker compose down` then drops the cluster.
      # (Upstream mounts the parent because it runs postgres:18, where PGDATA moved up.)
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-overfast} -d ${POSTGRES_DB:-overfast}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    build:
      context: ./build/valkey
    command: sh -c "./entrypoint.sh"
    env_file: ${APP_VOLUME_PATH:-.}/.env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${VALKEY_MEMORY_LIMIT:-1gb}
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 2s

  nginx:
    build:
      context: ./build/nginx
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    ports:
      # Bind to loopback only — Caddy on the host fronts the public side.
      - "127.0.0.1:${APP_PORT}:80"
    entrypoint: ["/entrypoint.sh"]
    env_file: ${APP_VOLUME_PATH:-.}/.env
    volumes:
      # Bind-mount, not a named volume: Docker fills a named volume from the
      # image only on first creation, so assets added later never arrive.
      # neon-junction.jpg sat 404 in production for two months because of it.
      # `git reset --hard` in the deploy keeps this directory current.
      - ./static:/static:ro
    depends_on:
      app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost || exit 1"]
      interval: 5s
      timeout: 2s

  reverse-proxy:
    profiles:
      - testing
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./build/reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf
      - ./build/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost || exit 1"]
      interval: 5s
      timeout: 2s

volumes:
  valkey-data:
  pg-data:
