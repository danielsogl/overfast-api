name: Migrate postgres 18

# One-shot: runs scripts/migrate-postgres-18.sh on the VPS, then the normal
# deploy. deploy-overfast.sh is only reached when the row counts matched. The
# script refuses a second run once the new volume exists. Delete this file after
# the migration.

on:
  workflow_dispatch:

# Shares the deploy's group so the two can never touch the host at once.
concurrency:
  group: release-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate and deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "30m"
          script: |
            set -euo pipefail
            cd /opt/overfast-api
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline
            bash scripts/migrate-postgres-18.sh
            /opt/deploy-overfast.sh

      - name: Check the live API
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 --compressed https://api.mercy-stats.app/roles | jq -e '.[0].key' >/dev/null; then
              echo "Health check OK after attempt $i."
              exit 0
            fi
            sleep 6
          done
          echo "::error::API not healthy after the migration."
          exit 1
